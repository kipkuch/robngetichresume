<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert Ngetich - Online Resume</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="marked.js"></script>
    <script>
        // Initialize marked.js
        if (typeof marked === 'undefined') {
            console.error('Marked.js not loaded!');
        } else {
            marked.setOptions({
                breaks: true,
                gfm: true
            });
        }
    </script>
</head>
<body>
    <!-- Floating Menu -->
    <nav class="floating-menu">
        <div class="menu-toggle">
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <ul>
            <li><a href="#top" class="nav-link">Back to top</a></li>
            <li><a href="#about" class="nav-link">About</a></li>
            <li><a href="#skills" class="nav-link">Skills</a></li>
            <li><a href="#languages" class="nav-link">Languages</a></li>
            <li><a href="#work-experience" class="nav-link">Work Experience</a></li>
            <li><a href="#projects" class="nav-link">Projects</a></li>
            <li><a href="#education" class="nav-link">Education</a></li>
        </ul>
    </nav>
    <div class="container" id="top">
        <header>
            <div class="profile-section">
                <div class="profile-image">
                    <img src="assets/profile.jpg" alt="Robert Ngetich">
                </div>
                <div class="profile-info">
                    <h1>Robert Ngetich</h1>
                    <h2>Software Engineer</h2>
                    <div class="contact-info">
                        <p class="email-contact"><i class="fas fa-envelope"></i></p>
                        <p><i class="fas fa-phone"></i> +33 6 88 97 27 14</p>
                        <p><i class="fas fa-map-marker-alt"></i> Paris, France</p>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section class="about" id="about">
                <h2>About Me</h2>
                <div id="about-content"></div>
            </section>

            <section class="skills" id="skills">
                <h2>Skills</h2>
                <div class="skills-container">
                    <div class="skills-grid" id="skills-grid"></div>
                </div>
                <button class="skills-expand-button" data-expanded="false">Show more</button>
            </section>

            <section class="languages" id="languages">
                <h2>Spoken Languages</h2>
                <div class="languages-grid" id="languages-grid"></div>
            </section>

            <section class="experience" id="work-experience">
                <h2>Work Experience</h2>
                <div class="timeline-container" id="timeline-container">
                    <!-- Timeline items will be populated by JavaScript -->
                </div>
            </section>

            <section class="projects" id="projects">
                <h2>Project Highlights</h2>
                <div class="projects-container" id="projects-container">
                    <!-- Projects will be populated by JavaScript -->
                </div>
            </section>

            <section class="education" id="education">
                <h2>Education</h2>
                <div class="education-grid" id="education-grid"></div>
            </section>


        </main>

        <footer>
            <div class="social-links">
                <a href="https://github.com/kipkuch" class="social-link" target="_blank" rel="noopener noreferrer" title="GitHub Profile">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://stackoverflow.com/users/31749/robert-ngetich" class="social-link" target="_blank" rel="noopener noreferrer" title="Stack Overflow Profile">
                    <i class="fab fa-stack-overflow"></i>
                </a>
                <a href="https://www.linkedin.com/in/robert-ngetich/" class="social-link" target="_blank" rel="noopener noreferrer" title="LinkedIn Profile">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>
            <p>&copy; 2025 Robert Ngetich. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Add error handling for script loading
        window.addEventListener('error', (event) => {
            console.error('Script error:', event);
        });
        
        // Load our main script
        const script = document.createElement('script');
        script.src = 'script.js';
        script.onload = () => {
            console.log('Main script loaded successfully');
        };
        script.onerror = () => {
            console.error('Failed to load main script');
        };
        document.body.appendChild(script);
    </script>

    <!-- Floating Action Button -->
    <button id="floating-button" class="floating-button">
        <i class="fas fa-arrow-up"></i>
    </button>
</body>
</html>
